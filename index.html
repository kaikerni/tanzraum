<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TanzRaum Demo</title><style>:root{--r:#c9182b;--bg:#f6f7f9;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:var(--bg);color:#111827}.app{display:flex;min-height:100vh}.side{width:240px;background:white;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0}.logo{font-size:26px;font-weight:800;padding:0 12px 20px}.logo i{color:var(--r);font-style:normal}.nav button{width:100%;padding:11px 13px;border:0;background:none;text-align:left;border-radius:10px;margin:2px 0}.nav button:hover,.nav .on{background:#fbeaec;color:var(--r);font-weight:700}.main{margin-left:240px;width:calc(100% - 240px)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0}.pill{padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px}.red{color:var(--r)}.content{padding:30px;max-width:1400px;margin:auto}.between{display:flex;justify-content:space-between;align-items:center;gap:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat{font-size:28px;font-weight:800;margin-top:7px}.muted{color:#6b7280}.section{margin-top:20px}.list{display:grid;gap:9px}.btn{border:0;background:#151515;color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.btn.red{background:var(--r)}.btn.light{background:#f1f3f5;color:#111}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px}.tabs .on{background:#111;color:#fff}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo i{font-size:22px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:70px;width:calc(100% - 70px)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.content{padding:18px}}</style></head><body><div class="app"><aside class="side"><div class="logo">Tanz<i>Raum</i></div><div class="nav" id="nav"></div></aside><main class="main"><header><b id="title">Start</b><span class="pill red" id="plan">VEREIN</span></header><div class="content" id="c"></div></main></div><script>const S={p:"Start",plan:"VEREIN",f:"Alle"};const E=[['Training – Jugend Garde 1','08.09.2026 · 18:00–19:30','Vereinsheim','Jugend'],['Training – Junioren Garde','09.09.2026 · 18:30–20:00','Turnhalle Süd','Junioren'],['Qualifikationsturnier','15.11.2026 · 10:00','Mannheim','Ü15'],['Auftritt Herbstfest','22.11.2026 · 14:00','Festhalle Zeiskam','Alle']];const G=[['Jugend Garde 1','Jugend',18,'Anna Müller'],['Junioren Garde','Junioren',16,'Julia Weber'],['Ü15 Garde','Ü15',21,'Michael Klein'],['Tanzmariechen','Jugend',6,'Anna Müller'],['Tanzmajor','Jugend',4,'Julia Weber'],['Schautanz Jugend','Jugend',14,'Michael Klein']];function items(){let a=[['🏠','Start'],['📅','Kalender'],['👥','Gruppen'],['🏋️','Training'],['💬','Chat'],['🎵','Musik & Videos'],['📄','Dokumente'],['🏆','Turniere']];if(S.plan!='FREE')a.push(['🤝','Trainer-Netzwerk']);if(S.plan=='VEREIN')a.push(['⚙️','Verwaltung']);a.push(['👤','Profil']);return a}function nav(){document.querySelector('#nav').innerHTML=items().map(x=>`<button class="${S.p==x[1]?'on':''}" onclick="go('${x[1]}')">${x[0]} ${x[1]}</button>`).join('')}function go(x){S.p=x;title.textContent=x;nav();render()}function ev(e){return `<div class=item><div class=between><div><b>${e[0]}</b><br><span class=muted>${e[1]} · ${e[2]}</span></div><small>${e[3]}</small></div></div>`}function render(){let h='';if(S.p=='Start')h=`<div class=between><div><h1>Willkommen bei TanzRaum 👋</h1><span class=muted>Tanzverein Musterstadt · ${S.plan}</span></div><button class="btn red">+ Termin</button></div><div class=grid><div class=card>👥<div class=stat>85</div><span class=muted>Mitglieder</span></div><div class=card>💃<div class=stat>6</div><span class=muted>Gruppen</span></div><div class=card>📅<div class=stat>12</div><span class=muted>Termine</span></div><div class=card>💬<div class=stat>4</div><span class=muted>Nachrichten</span></div></div><div class=section card><h2>Nächste Termine</h2><div class=list>${E.slice(0,3).map(ev).join('')}</div></div>`;else if(S.p=='Kalender')h=`<h1>Vereinskalender</h1><span class=muted>Ein Kalender für den gesamten Verein</span><div class=tabs>${['Alle','Jugend','Junioren','Ü15','Tanzmariechen','Tanzmajor','Schautanz'].map(x=>`<button class="${S.f==x?'on':''}" onclick="S.f='${x}';render()">${x}</button>`).join('')}</div><div class=list>${E.filter(e=>S.f=='Alle'||e[3]==S.f||e[3]=='Alle').map(ev).join('')}</div>`;else if(S.p=='Gruppen')h=`<h1>Gruppen</h1><span class=muted>Altersklassen und freie Gruppen</span><div class="grid section">${G.map(g=>`<div class=card><div class=between><b>${g[0]}</b><small>${g[1]}</small></div><p>${g[2]} Mitglieder</p><span class=muted>👩‍🏫 ${g[3]}</span></div>`).join('')}</div>`;else if(S.p=='Training')h=`<h1>Training</h1><span class=muted>Trainings und Abwesenheiten</span><div class="list section">${E.filter(e=>e[0].startsWith('Training')).map(e=>`<div class=item><div class=between><div><b>${e[0]}</b><br><span class=muted>${e[1]} · ${e[2]}</span></div><button class="btn light" onclick="alert('Abwesenheit gemeldet')">🔴 Absage</button></div></div>`).join('')}</div>`;else if(S.p=='Trainer-Netzwerk')h=`<h1>🤝 Trainer-Netzwerk</h1><span class=muted>Nur BASIC und VEREIN</span><div class="grid section"><div class=card><h2>Trainer finden</h2><p>Andere Trainer und Betreuer vereinsübergreifend finden.</p><button class="btn red">Suchen</button></div><div class=card><h2>Verbindungen</h2><div class=stat>12</div></div></div>`;else if(S.p=='Turniere')h=`<h1>Turniere</h1><span class=muted>Allgemeine Turnierinfos · Anmeldung über BDK</span><div class="list section">${[['Qualifikationsturnier','15.11.2026','Mannheim'],['Landesmeisterschaft','29.11.2026','Mainz'],['Deutsche Meisterschaft','2027','wird bekanntgegeben']].map(x=>`<div class=item><b>🏆 ${x[0]}</b><br><span class=muted>${x[1]} · ${x[2]}</span></div>`).join('')}</div>`;else if(S.p=='Chat')h=`<h1>Chats</h1><div class="two section"><div class=card><h2>Gruppenchats</h2><div class=item>Jugend Garde 1<br><span class=muted>Anna: Musik ist hochgeladen ✓✓</span></div></div><div class=card><h2>Direktnachrichten</h2><div class=item>Anna Müller<br><span class=muted>Bis morgen! ✓✓</span></div></div></div>`;else if(S.p=='Musik & Videos')h=`<h1>Musik & Videos</h1><div class="grid section"><div class=card>🎵<h3>Trainingsmusik Jugend</h3><button class="btn light">▶ Abspielen</button></div><div class=card>🎥<h3>Training – Choreografie</h3><button class="btn light">▶ Ansehen</button></div></div>`;else if(S.p=='Dokumente')h=`<h1>Dokumente</h1><div class="list section"><div class=item>📄 Turnierinfo November</div><div class=item>📄 Ablaufplan Training</div></div>`;else if(S.p=='Verwaltung')h=`<h1>Vereinsverwaltung</h1><div class=grid section>${[['👥','Mitglieder','85'],['👩‍🏫','Trainer & Betreuer','14'],['🏷️','Gruppen','6'],['🔐','Rollen & Rechte','5'],['📅','Kalender','12'],['📨','Einladungen','3']].map(x=>`<div class=card><div>${x[0]} ${x[1]}</div><div class=stat>${x[2]}</div><button class="btn light">Verwalten</button></div>`).join('')}</div>`;else h=`<h1>${S.p}</h1><div class=card section><p>Dieser Bereich ist in der Demo vorbereitet.</p><button class="btn red" onclick="setPlan('FREE')">FREE testen</button> <button class="btn light" onclick="setPlan('BASIC')">BASIC testen</button> <button class="btn red" onclick="setPlan('VEREIN')">VEREIN testen</button></div>`;c.innerHTML=h}function setPlan(p){S.plan=p;plan.textContent=p;S.p='Start';nav();render()}nav();render();</script></body></html>
